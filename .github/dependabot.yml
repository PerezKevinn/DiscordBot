# Avisa (con un PR) cuando hay actualizaciones de dependencias, sobre todo las de seguridad.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node deben coincidir con el Node del VPS (22): sin saltos de versión mayor
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 es una reescritura: migrar es un trabajo aparte, no una actualización automática
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
